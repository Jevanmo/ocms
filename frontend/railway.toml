# Railway: add a second service from this repo with Root Directory = frontend.
# Set variable VITE_API_URL (see README) and mark it available at **build** time
# so Vite can embed your backend URL (e.g. https://your-api.up.railway.app/api).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
